<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Güney Marmara Adaları">
  <!-- Adalar logosu: turkuaz çerçeve, güneş, palmiyeli ada, arkada ikinci ada, dalgalar -->
  <defs><clipPath id="ada-ic"><circle cx="32" cy="32" r="27.5"/></clipPath></defs>
  <circle cx="32" cy="32" r="32" fill="#0f6b6b"/>
  <circle cx="32" cy="32" r="28.5" fill="#ffffff"/>
  <g clip-path="url(#ada-ic)">
    <circle cx="42" cy="22" r="7.5" fill="#f2c14e"/>
    <!-- arkadaki ada -->
    <path d="M30 40 Q42 29 58 40 Z" fill="#7fc4bd"/>
    <!-- öndeki ada (kumsal + yeşil tepe) -->
    <path d="M4 42 Q18 26 36 42 Z" fill="#0f6b6b"/>
    <path d="M6 42 Q20 38 34 42 Z" fill="#e8c98a"/>
    <!-- palmiye -->
    <path d="M19 37 Q21 29 18.5 21" fill="none" stroke="#0f6b6b" stroke-width="2" stroke-linecap="round"/>
    <path d="M18.5 21 q-5 -1.5 -8.5 2.5 M18.5 21 q5 -2.5 8.5 1.5 M18.5 21 q-2.5 -4.5 -6.5 -5 M18.5 21 q3 -4.5 7 -4" fill="none" stroke="#0f6b6b" stroke-width="2" stroke-linecap="round"/>
    <rect x="0" y="42" width="64" height="22" fill="#ffffff"/>
    <!-- deniz -->
    <path d="M4 48 q4 -3 8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0" fill="none" stroke="#1b8f86" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M8 54 q4 -3 8 0 t8 0 t8 0 t8 0 t8 0 t8 0" fill="none" stroke="#1b8f86" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
